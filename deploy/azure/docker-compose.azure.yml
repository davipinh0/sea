# SEA na VM do Azure, junto com o compose principal:
#   docker compose -f docker-compose.yml -f deploy/azure/docker-compose.azure.yml up -d
# Só o Caddy fica exposto (80/443): ele cuida do certificado HTTPS e entrega /api à API e o resto ao
# painel. O restante fica preso ao 127.0.0.1 da VM.

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: sea-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SEA_DOMAIN: ${SEA_DOMAIN:?Set SEA_DOMAIN in .env}
    volumes:
      - ./deploy/azure/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - admin

  db:
    restart: unless-stopped

  api:
    restart: unless-stopped
    environment:
      # O Caddy, na mesma rede interna, informa o HTTPS e o IP real.
      TRUST_PROXY: "true"
      CORS_ORIGINS: https://${SEA_DOMAIN}

  admin:
    restart: unless-stopped

  celery-worker:
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
